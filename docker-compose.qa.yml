name: aknews-qa

services:
  db:
    image: postgres:16-alpine
    container_name: aknews-db
    restart: unless-stopped
    env_file:
      - deploy/.env.qa
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    volumes:
      - aknews_qa_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - aknews_qa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aknews-api
    restart: unless-stopped
    env_file:
      - deploy/.env.qa
    expose:
      - "8000"
    networks:
      - aknews_qa_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: aknews-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - aknews_qa_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aknews_qa_net:
    name: aknews_qa_net
    driver: bridge

volumes:
  aknews_qa_pgdata:
    name: aknews_qa_pgdata
